info:
  name: 1. Read Model (Public)
  type: http
  seq: 2

http:
  method: GET
  url: http://mywebui/api/model.json
  headers:
    - name: Cookie
      value: "{{anon_cookie}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setGlobalEnvVar("sec_token", data.session.secToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: 0. Generate Anonymous Cookie
  type: http
  seq: 1

http:
  method: GET
  url: http://mywebui/sess_cd_tmp
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const cookies = bru.cookies.getCookiesForUrl(req.getUrl());
        bru.setVar("anon_cookie", cookies);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false

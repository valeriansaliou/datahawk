info:
  name: 2. Generate Authenticated Cookie
  type: http
  seq: 3

http:
  method: POST
  url: http://mywebui/Forms/config
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: User-Agent
      value: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:150.0) Gecko/20100101 Firefox/150.0
    - name: Origin
      value: http://10.0.2.1
    - name: Referer
      value: http://10.0.2.1/index.html
    - name: Cookie
      value: "{{anon_cookie}}"
  body:
    type: form-urlencoded
    data:
      - name: token
        value: "{{sec_token}}"
      - name: session.password
        value: <admin_password_here>
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const cookies = bru.cookies.getCookiesForUrl(req.getUrl());
        bru.setVar("auth_cookie", cookies);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
  forwardAuthorizationHeader: false
